name: Windows-CPU-Inference

on:
  workflow_call:
    inputs:
      clone-can-skip:
        type: string
        required: false
        default: "false"
      ref:
        type: string
        required: false
        default: "v3.4.0"
        description: Branch, tag or commit SHA to build, e.g. v3.4.0
      targets:
        type: string
        required: false
        default: '["vs2019-x86","vs2019-x64","vs2022-x86","vs2022-x64"]'
        description: JSON array of build targets, e.g. ["vs2019-x64"] to build only one
  workflow_dispatch:
    inputs:
      ref:
        type: choice
        required: false
        default: "v3.4.0"
        description: PaddlePaddle version tag to build
        options:
          - v3.4.0
          - v3.3.1
          - v3.3.0
          - v3.2.2
          - v3.2.1
          - v3.2.0
          - v3.1.1
          - v3.1.0
          - v3.0.0
          - v2.6.2
          - v2.6.1
          - v2.6.0
          - v2.5.2
          - v2.5.1
          - v2.5.0
          - v2.4.2
          - v2.4.1
          - v2.4.0
          - v2.3.2
          - v2.3.1
          - v2.3.0
      targets:
        type: choice
        required: false
        default: all
        description: Build targets to run
        options:
          - all
          - vs2019-x86
          - vs2019-x64
          - vs2022-x86
          - vs2022-x64

permissions: read-all

env:
  PADDLE_VERSION: 0.0.0

defaults:
  run:
    shell: cmd

jobs:
  build-cpu:
    name: Build CPU (${{ matrix.vs }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        target: ${{ fromJson(startsWith(inputs.targets, '[') && inputs.targets || (inputs.targets == 'all' && '["vs2019-x86","vs2019-x64","vs2022-x86","vs2022-x64"]' || format('["{0}"]', inputs.targets))) }}
        include:
          - target: vs2019-x86
            vs: VS2019
            arch: x86
            runner: windows-2022
            vcvars_bat: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat
            vcvars_args: x86 -vcvars_ver=14.29
            with_avx: OFF
            artifact_name: fluid_inference-vs2019-x86
          - target: vs2019-x64
            vs: VS2019
            arch: x64
            runner: windows-2022
            vcvars_bat: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat
            vcvars_args: x64 -vcvars_ver=14.29
            with_avx: ON
            artifact_name: fluid_inference-vs2019-x64
          - target: vs2022-x86
            vs: VS2022
            arch: x86
            runner: windows-2022
            vcvars_bat: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat
            vcvars_args: x86
            with_avx: OFF
            artifact_name: fluid_inference-vs2022-x86
          - target: vs2022-x64
            vs: VS2022
            arch: x64
            runner: windows-2022
            vcvars_bat: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat
            vcvars_args: x64
            with_avx: ON
            artifact_name: fluid_inference-vs2022-x64
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Install Ninja
        run: pip install ninja==1.11.1.4

      - name: Configure cmake (${{ matrix.vs }} ${{ matrix.arch }})
        run: |
          rem set vs language to english to block showIncludes
          set VSLANG=1033
          rem 'DISTUTILS_USE_SDK' indicates that the user has selected the compiler
          set DISTUTILS_USE_SDK=1
          call "${{ matrix.vcvars_bat }}" ${{ matrix.vcvars_args }}
          if "${{ matrix.arch }}"=="x64" set PreferredToolArchitecture=x64
          rem Set the default generator for cmake to Ninja
          setx CMAKE_GENERATOR Ninja
          if not exist build mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DWITH_GPU=OFF -DWITH_PYTHON=OFF -DWITH_TESTING=OFF ^
            -DWITH_DISTRIBUTE=OFF -DWITH_TENSORRT=OFF -DON_INFER=ON ^
            -DWITH_AVX=${{ matrix.with_avx }} -DWITH_MKL=OFF ^
            -DWITH_POCKETFFT=OFF -DWITH_UNITY_BUILD=ON ^
            -DMSVC_STATIC_CRT=ON

      - name: Build inference lib (${{ matrix.vs }} ${{ matrix.arch }})
        run: |
          call "${{ matrix.vcvars_bat }}" ${{ matrix.vcvars_args }}
          cd build
          ninja inference_lib_dist

      - name: Upload artifact (${{ matrix.vs }} ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build\fluid_inference_install_dir\
          retention-days: 1
