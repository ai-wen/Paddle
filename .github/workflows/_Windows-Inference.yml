name: Windows-CPU-Inference

on:
  workflow_call:
    inputs:
      clone-can-skip:
        type: string
        required: false
        default: "false"
      targets:
        type: string
        required: false
        default: '["vs2019-x86","vs2019-x64","vs2022-x86","vs2022-x64"]'
        description: JSON array of build targets, e.g. ["vs2019-x64"] to build only one

permissions: read-all

env:
  PADDLE_VERSION: 0.0.0

defaults:
  run:
    shell: cmd

jobs:
  build-cpu:
    name: Build CPU (${{ matrix.vs }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: ${{ contains(fromJson(inputs.targets), matrix.target) }}
    strategy:
      matrix:
        include:
          - target: vs2019-x86
            vs: VS2019
            arch: x86
            runner: windows-2019
            vcvars: C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\VC\Auxiliary\Build\vcvarsall.bat x86
            with_avx: OFF
            artifact_name: fluid_inference-vs2019-x86
          - target: vs2019-x64
            vs: VS2019
            arch: x64
            runner: windows-2019
            vcvars: C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\VC\Auxiliary\Build\vcvars64.bat
            with_avx: ON
            artifact_name: fluid_inference-vs2019-x64
          - target: vs2022-x86
            vs: VS2022
            arch: x86
            runner: windows-2022
            vcvars: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat x86
            with_avx: OFF
            artifact_name: fluid_inference-vs2022-x86
          - target: vs2022-x64
            vs: VS2022
            arch: x64
            runner: windows-2022
            vcvars: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat
            with_avx: ON
            artifact_name: fluid_inference-vs2022-x64
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Install Ninja
        run: pip install ninja==1.11.1.4

      - name: Configure cmake (${{ matrix.vs }} ${{ matrix.arch }})
        run: |
          rem set vs language to english to block showIncludes
          set VSLANG=1033
          rem 'DISTUTILS_USE_SDK' indicates that the user has selected the compiler
          set DISTUTILS_USE_SDK=1
          call "${{ matrix.vcvars }}"
          rem Windows 10 Kit bin dir
          set "PATH=C:\Program Files (x86)\Windows Kits\10\bin\10.0.17763.0\x64;%PATH%"
          if "${{ matrix.arch }}"=="x64" set PreferredToolArchitecture=x64
          rem Set the default generator for cmake to Ninja
          setx CMAKE_GENERATOR Ninja
          if not exist build mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DWITH_GPU=OFF -DWITH_PYTHON=OFF -DWITH_TESTING=OFF ^
            -DWITH_DISTRIBUTE=OFF -DWITH_TENSORRT=OFF -DON_INFER=ON ^
            -DWITH_AVX=${{ matrix.with_avx }} -DWITH_MKL=OFF ^
            -DWITH_POCKETFFT=OFF -DWITH_UNITY_BUILD=ON ^
            -DMSVC_STATIC_CRT=ON

      - name: Build inference lib (${{ matrix.vs }} ${{ matrix.arch }})
        run: |
          call "${{ matrix.vcvars }}"
          cd build
          ninja inference_lib_dist

      - name: Upload artifact (${{ matrix.vs }} ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build\fluid_inference_install_dir\
          retention-days: 1
